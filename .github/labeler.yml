ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "docker-compose.yml"
          - "requirements.txt"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"

server:
  - changed-files:
      - any-glob-to-any-file:
          # Top level only, so catalogue changes stay i18n and not both.
          - "server/*.py"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "server/lang/**"

kindle:
  - changed-files:
      - any-glob-to-any-file:
          - "kindle/**"

collector:
  - changed-files:
      - any-glob-to-any-file:
          - "collect/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - ".env.example"
